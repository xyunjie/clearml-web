<header>
  <div class="title">
    API CREDENTIALS
    <mat-icon
      class="info sm"
      fontSet="al" fontIcon="al-ico-info-circle"
      smTooltip="供调用 ClearML 服务器 API 的 ClearML 客户端使用的 Key/Secret 凭据对，包括 ClearML SDK、Agent 以及其他调用 API 的客户端"
      matTooltipPosition="above"
    ></mat-icon>
  </div>
</header>
@for (cred of credentials() | keyValue; track cred.key) {
  <div class="section mb-4">
    <sm-admin-credential-table
      [credentials]="cred?.value"
      (updateCredentialLabel)="updateLabel($event)"
      (credentialRevoked)="onCredentialRevoked($event)"
    ></sm-admin-credential-table>
    <button mat-button
            class="add-button"
            [class.disabled]="credState().creatingCredentials()"
            (click)="createCredential()"
    >
      <mat-icon fontSet="al" fontIcon="al-ico-add"></mat-icon>
      Create new credentials
    </button>
  </div>
}
