<h1>确保整个组织的可控性、一致性与合规性</h1>
<div class="sub-title">
  允许管理员集中配置运行参数并实施合规策略，从而提升生产力。
</div>

<div class="section">
  <div class="details">
    <h2>配置保险库</h2>
    管理员设置的值可以扩展或覆盖用户配置，便于下发必需的配置，并管控安全敏感的密钥。
  </div>
  <div class="image" (click)="imageClicked(image1)">
    <img
      [ngSrc]="'app/webapp-common/assets/marketing/admin-vaults-fhd-' + theme() + '.png'"
      #image1
      width="640"
      height="360"
      alt="vaults"
    >
  </div>
</div>

<div class="section">
  <div class="image" (click)="imageClicked(image2)">
    <img
      [ngSrc]="'app/webapp-common/assets/marketing/service-accounts-fhd-' + theme() + '.png'"
      #image2
      width="640"
      height="360"
      alt="Service accounts"
    >
  </div>
  <div class="details">
    <h2>服务账号</h2>
    为自动化流程和应用提供安全、可管理的 ClearML API 访问，无需使用个人用户凭据，从而简化自动化。
  </div>
</div>
<div class="section">
  <div class="details">
    <h2>访问控制</h2>
    为任意 ClearML 资源设置细粒度的访问权限，通过定义谁可以访问组织中的项目、数据集、模型和执行队列，保障协作中的数据安全。
  </div>
  <div class="image" (click)="imageClicked(image3)">
    <img
      [ngSrc]="'app/webapp-common/assets/marketing/rbac-fhd-' + theme() + '.png'"
      #image3
      width="640"
      height="360"
      alt="RBAC"
    >
  </div>
</div>

<div class="section">
  <div class="image" (click)="imageClicked(image4)">
    <img
      [ngSrc]="'app/webapp-common/assets/marketing/idp-fhd-' + theme() + '.png'"
      #image4
      width="640"
      height="360"
      alt="Idp sso"
    >
  </div>
  <div class="details">
    <h2>身份提供商</h2>
    与组织的 SAML/OIDC 身份提供商集成，简化用户认证与访问控制。
  </div>
</div>
<div class="cta">
  <a href="https://clear.ml/contact-us" target="_blank" class="cta-button">
    <mat-icon fontSet="al" fontIcon="al-ico-bullhorn"></mat-icon>联系 ClearML</a>
</div>
