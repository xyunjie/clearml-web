<sm-dialog-template iconClass="al-ico-access-key" (xClicked)="xClicked()" [header]="title">
  @if (data?.provider === 'gcs') {
    <div class="gcs-note" >请使用 Google 账号<a href="https://accounts.google.com/AccountChooser?prompt=select_account" target="_blank">登录</a>以查看 <b>{{bucket}}</b> 存储桶内容，然后<a href="#" (click)="$event.preventDefault(); reload()">刷新</a>页面。</div>
    <mat-checkbox class="my-2" [(ngModel)]="useGcsHmac" (change)="dontShowGcsAgain = false">改用 <a class="mx-1" href="https://cloud.google.com/storage/docs/authentication/managing-hmackeys#create" target="_blank">HMAC</a></mat-checkbox>
    @if (!useGcsHmac) {
      <mat-checkbox class="d-block my-2" [(ngModel)]="dontShowGcsAgain">对 <span class="ellipsis bucket-name">{{bucket}}</span> 存储桶不再显示</mat-checkbox>
    }
  }
  @if (data?.provider !== 'gcs'|| useGcsHmac) {
    <sm-s3-access-dialog
      [header]="header"
      [bucket]="bucket"
      [endpoint]="endpoint"
      [region]="region"
      [secret]="secret"
      [key]="key"
      [token]="token"
      [editMode]="editMode"
      [isAzure]="data?.provider === 'azure'"
      [isGCS]="data?.provider === 'gcs'"
      (closeSave)="saveS3Credentials($event)"
      (closeCancel)="cancelClicked()">
    </sm-s3-access-dialog>
  }
  @if ( dontShowGcsAgain && !useGcsHmac) {
    <div class="w-100 d-flex justify-content-center mt-4">
      <button mat-flat-button (click)="saveS3Credentials({Bucket: bucket, Key: '', Secret: ''})">保存</button>
    </div>  }
</sm-dialog-template>
