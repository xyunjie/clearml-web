@if (data) {
  <sm-dialog-template iconClass="al-ico-pipelines" header="新建流水线">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </sm-dialog-template>
} @else {
  <div class="content">
    <div class="code">
      <p>
        运行以下代码查看快速示例（需要 ClearML 1.3 或更高版本）<br>
        更多详情请参阅<a [class.dark]="createButton()" [href]="confService.configuration().docsLink + '/latest/docs/pipelines'"
      target="_blank">文档</a>
      </p>
    @if (initPipelineCode()) {
      <sm-code-editor [code]="initPipelineCode()" [readonly]="true" [showCopyButton]="true"></sm-code-editor>
    }
  </div>
  <div class="diagram">
    <i class="i-pipeline-empty-state"></i>
  </div>
</div>
}

<ng-template #content>
  <div class="content">
    <div class="code">
        <p>
          运行以下代码查看快速示例（需要 ClearML 1.3 或更高版本）<br>
          更多详情请参阅<a [class.dark]="createButton()" [href]="confService.configuration().docsLink + '/latest/docs/pipelines'"
        target="_blank">文档</a>
        </p>
    @if (initPipelineCode()) {
      <sm-code-editor [code]="initPipelineCode()" [readonly]="true" [showCopyButton]="true"></sm-code-editor>
    }
  </div>
  <div class="diagram">
    <i class="i-pipeline-empty-state"></i>
  </div>
</div>
</ng-template>
