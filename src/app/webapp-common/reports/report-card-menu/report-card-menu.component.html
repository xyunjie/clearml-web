<button mat-icon-button [matMenuTriggerFor]="pipelinesMenu" smClickStopPropagation #trigger="matMenuTrigger" [class.menu-opened]="trigger.menuOpen">
  <mat-icon fontSet="al" fontIcon="al-ico-bars-menu"></mat-icon>
</button>
<mat-menu #pipelinesMenu="matMenu">
  <button mat-menu-item data-id="renameOption" (click)="rename.emit()" [disabled]="isExample">
    <mat-icon fontSet="al" [fontIcon]="icons.EDIT"></mat-icon>重命名
  </button>
  <button mat-menu-item data-id="shareOption" (click)="share.emit()">
    <mat-icon fontSet="al" [fontIcon]="icons.SHARE"></mat-icon>分享
  </button>
  <button mat-menu-item data-id="addTagOption" [matMenuTriggerFor]="tagsMenu.matMenu()">
    <mat-icon fontSet="al" [fontIcon]="icons.TAG"></mat-icon>添加标签
  </button>
  <hr>
    <button mat-menu-item data-id="moveToOption" (click)="moveTo.emit()" [disabled]="isExample">
      <mat-icon fontSet="al" [fontIcon]="icons.MOVE_TO"></mat-icon>移动到
    </button>
    <button mat-menu-item data-id="archiveOption" (click)="archive.emit(!isArchived)" [disabled]="isExample">
      <mat-icon fontSet="al"
                [fontIcon]="isArchived ? icons.RESTORE : icons.ARCHIVE"></mat-icon>{{isArchived ? '从归档中恢复' : '归档'}}
    </button>
    @if (isArchived) {
      <button mat-menu-item data-id="deleteOption" (click)="delete.emit()">
        <mat-icon fontSet="al"
                  [fontIcon]="icons.REMOVE"></mat-icon>删除
      </button>
    }

  </mat-menu>
  <sm-tags-menu
    #tagsMenu
    class="light-theme"
    [tags]="report?.tags"
    [filterByProject]="true"
    [projectTags]="allTags"
    [companyTags]="null"
    (tagSelected)="addTag.emit($event)">
  </sm-tags-menu>
