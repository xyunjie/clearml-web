<div class="sm-card-list-header" [class.archive-mode]="archive()">
  @if (!disableSort()) {
    <div class="recent-title">
      <sm-menu [header]="sortByTitle() === 'NAME' ? '名称' : '最近更新'" class="menu">
        <sm-menu-item itemLabel="最近更新"
                      [sortOrder]="sortByTitle() === 'RECENT' && sortOrder()"
                      (itemClicked)="orderByChanged.emit('last_update')"></sm-menu-item>
        <sm-menu-item itemLabel="名称"
                      [sortOrder]="sortByTitle() === 'NAME' && sortOrder()"
                      (itemClicked)="orderByChanged.emit('name')"></sm-menu-item>
      </sm-menu>
      <sm-main-pages-header-filter [allTags]="allTags()" [statusOptions]="reportsStatusOptions"></sm-main-pages-header-filter>
      <sm-button-toggle
        [ngModel]="!!projectId()"
        (ngModelChange)="!archive() && !(!!projectId() && $event) && toggleNestedView.emit($any($event))"
        [disabled]="archive()"
        [options]="[
             {value: false, icon: 'al-ico-flat-view',  label: '列表视图'},
             {value: true, icon:'al-ico-project-path', label: '项目视图'}
            ]"
      ></sm-button-toggle>
      <sm-common-search class="ms-3"></sm-common-search>
    </div>
  }
  <div class="d-flex-center gap">
    <sm-toggle-archive
      [showArchived]="archive()"
      (toggleArchived)="archiveToggled.emit($event)"
    ></sm-toggle-archive>
    @if (!disableCreate()) {
      <button mat-flat-button
              data-id="createNewReport"
              [disabled]="archive()"
              (click)="createReportClicked.emit(projectId())">
        <mat-icon fontSet="al" fontIcon="al-ico-add"></mat-icon>
        新建报告
      </button>
    }
  </div>
</div>
