<div class="selector" [formGroup]="rangeControl" (blur)="onTouched()">
  <mat-form-field appearance="outline" class="time-selector no-bottom" subscriptSizing="dynamic">
    <mat-select formControlName="period">
      @for (timeFrame of timeFrameOptions(); track timeFrame.value) {
        <mat-option [value]="timeFrame.value">{{ timeFrame.label }}</mat-option>
      }
      <mat-divider class="mb-2"></mat-divider>

      <mat-option value="custom"
                  smClickStopPropagation
                  #customOption
                  class="custom-option"
                  (click)="$event.preventDefault(); $event.stopPropagation();"
                  [class.error]="rangeControl.hasError('datesInverted')">

        <div class="custom-option-container" smClickStopPropagation>
          <mat-form-field class="custom-selector no-bottom" subscriptSizing="dynamic">
            <mat-date-range-input [rangePicker]="picker">
              <input matStartDate
                     placeholder="开始日期"
                     formControlName="from"
                     (blur)="applyChanges()"
                     (keydown)="$event.stopPropagation()"
                     (keyup.enter)="applyChanges()">
              <input matEndDate
                     placeholder="结束日期"
                     formControlName="to"
                     (blur)="applyChanges()"
                     (keydown)="$event.stopPropagation()"
                     (keyup.enter)="applyChanges()">
            </mat-date-range-input>
            <mat-datepicker-toggle matIconSuffix [for]="picker">自定义</mat-datepicker-toggle>
            <mat-date-range-picker #picker (closed)="applyChanges()"></mat-date-range-picker>
          </mat-form-field>
        </div>
      </mat-option>
      @if (rangeControl.hasError('datesInverted') && rangeControl.get('from')?.value) {
        <div class="date-range-alert">请确保开始日期早于结束日期。</div>
      }
    </mat-select>
  </mat-form-field>


</div>
