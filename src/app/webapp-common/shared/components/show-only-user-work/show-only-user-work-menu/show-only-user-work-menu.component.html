<sm-menu
  panelClasses="light-theme"
  [header]="showOnlyUserWork() ? '我的工作': '团队工作'"
  [prefixIconClass]="showOnlyUserWork() ? 'al-ico-me': 'al-ico-users'"
  class="menu" data-id="Team's Work">
  <sm-menu-item itemLabel="我的工作" (itemClicked)="userFilterChanged.emit(true)" iconClass="al-ico-me" data-id="My Work Option"></sm-menu-item>
  <sm-menu-item itemLabel="团队工作" (itemClicked)="userFilterChanged.emit(false)"
                iconClass="al-ico-users" data-id="Team's Work Option"></sm-menu-item>
</sm-menu>
