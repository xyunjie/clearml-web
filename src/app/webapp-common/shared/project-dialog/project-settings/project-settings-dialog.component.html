<sm-dialog-template
  iconClass="al-ico-projects"
  [header]="dialogTitle()"
  headerClass="no-uppercase"
>

  <mat-tab-group
    [mat-stretch-tabs]="false"
    mat-align-tabs="center"
    class="with-border"
    [dynamicHeight]="true"
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="tabChanged($event)"
  >

    <mat-tab label="常规">
      <ng-template mat-tab-label>
        常规
        @if (generalForm.projectForm?.invalid) {
          <span class="invalid-dot"></span>
        }
      </ng-template>
      <sm-edit-project-form
        #generalForm
        [project]="data.project"
        [isReadOnly]="readonlyProject()"
        (projectUpdated)="updateProject($event)"
        (cancelClicked)="closeDialog()"
        class="data-project">
      </sm-edit-project-form>
    </mat-tab>

    <mat-tab label="标量视图默认设置">
      <sm-graph-settings-bar
        class="graph-settings-menu"
        (click)="$event.stopPropagation()"
        [verticalLayout]="true"
        [smoothWeight]="settings()?.smoothWeight"
        [smoothSigma]="settings()?.smoothSigma"
        [smoothType]="settings()?.smoothType"
        [xAxisType]="settings()?.xAxisType"
        [groupBy]="settings()?.groupBy"
        [groupByOptions]="groupByOptions"
        [showOrigin]="settings()?.showOriginals"
        [clearable]="null"
        (changeWeight)="changeSmoothness($event)"
        (changeSigma)="changeSigma($event)"
        (changeXAxisType)="changeXAxisType($event)"
        (changeGroupBy)="changeGroupBy($event)"
        (changeSmoothType)="changeSmoothType($event)"
        (changeShowOrigin)="changeShowOriginals($event)"
      ></sm-graph-settings-bar>
      <div class="list">
        <div class="d-flex align-items-center">默认标量
          <i class="al-icon al-ico-info-circle sm ms-3"
             smTooltip="控制查看项目任务/模型标量时默认显示哪些指标"
          ></i></div>
        <sm-selectable-grouped-filter-list
          [list]="scalarList()"
          [nested]="settingsGroupBy() === 'none'"
          [checkedList]="selectedMetrics()"
          [searchTerm]="searchTerm()"
          (selectedChanged)="hiddenListChanged($event)"
          (searchTermChanged)="searchTermChanged($event)"
        ></sm-selectable-grouped-filter-list>
      </div>
    </mat-tab>
    @for (tab of extraTabs(); track tab) {
      <mat-tab [label]="tab.textLabel">
        <ng-template [cdkPortalOutlet]="tab.content"></ng-template>
      </mat-tab>
    }
    <ng-content></ng-content>
  </mat-tab-group>


  @if (!isEditing()){
    <mat-dialog-actions>
    <button mat-stroked-button (click)="closeDialog()" data-id="Cancel">取消</button>
    <button mat-flat-button (click)="save()" [disabled]="readonlyProject() || generalForm.projectForm.controls.default_output_destination.invalid || generalForm.projectForm.invalid || (!scalarSettingsChanged() && !generalChanged() && !hiddenChanged() && !extraDirty())" data-id="Save">
      保存
    </button>
  </mat-dialog-actions>
  }
</sm-dialog-template>
