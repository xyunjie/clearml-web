<sm-dialog-template class="neat" [header]="title" headerClass="no-uppercase">
  <div class="data-text">
    <sm-code-editor
      [code]="textData"
      [mode]="mode"
      [readonly]="readOnly"
      [placeholder]="placeHolder"
      [startPosition]="position()"
      data-id="editTextareaField"
    ></sm-code-editor>
  </div>
</sm-dialog-template>
<mat-dialog-actions>
  @if (!readOnly) {
      <button mat-stroked-button (click)="closeDialog(false)" class="yes-button" data-id="cancelButton">
        取消
      </button>
    }
    <button mat-flat-button (click)="closeDialog(!readOnly)" data-id="okButton">确定</button>
</mat-dialog-actions>
